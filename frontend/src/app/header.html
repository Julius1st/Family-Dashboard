<header class="header">
  <div class="header__left">
    <span class="header__clock">{{ time() }}</span>
    <span class="header__date">{{ date() }}</span>
  </div>

  <div class="header__right">
    <nav class="header__nav" aria-label="Seiten">
      <button
        type="button"
        class="header__nav-item"
        [class.header__nav-item--active]="isActive('tasks')"
        [attr.aria-current]="isActive('tasks') ? 'page' : null"
        (click)="select('tasks')"
      >
        Aufgaben
      </button>
      <button
        type="button"
        class="header__nav-item"
        [class.header__nav-item--active]="isActive('transit')"
        [attr.aria-current]="isActive('transit') ? 'page' : null"
        (click)="select('transit')"
      >
        Abfahrten & Wetter
      </button>
    </nav>

    <button
      type="button"
      class="header__theme-toggle"
      [attr.aria-label]="themeToggleLabel()"
      (click)="toggleTheme()"
    >
      @if (showSunIcon()) {
        <svg
          class="header__theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="2.5" x2="12" y2="5" />
          <line x1="12" y1="19" x2="12" y2="21.5" />
          <line x1="2.5" y1="12" x2="5" y2="12" />
          <line x1="19" y1="12" x2="21.5" y2="12" />
          <line x1="5.1" y1="5.1" x2="6.9" y2="6.9" />
          <line x1="17.1" y1="17.1" x2="18.9" y2="18.9" />
          <line x1="5.1" y1="18.9" x2="6.9" y2="17.1" />
          <line x1="17.1" y1="6.9" x2="18.9" y2="5.1" />
        </svg>
      } @else {
        <svg
          class="header__theme-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" />
        </svg>
      }
    </button>
  </div>
</header>
