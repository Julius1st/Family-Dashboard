@if (widgets(); as widgetList) {
  @if (widgetList.length === 0) {
    <p class="dashboard-shell__empty">No widgets are configured yet.</p>
  } @else {
    <div class="dashboard-shell__grid">
      @for (widget of widgetList; track widget.id) {
        <ng-container
          *ngComponentOutlet="resolveWidgetTileComponent(widget.id); inputs: { descriptor: widget }"
        />
      }
    </div>
  }
} @else {
  <p class="dashboard-shell__loading">Loading widgets…</p>
}
