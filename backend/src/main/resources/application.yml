spring:
  # Loads backend/.env (gitignored, never committed) as if it were a
  # .properties file - Spring Boot's documented "extension hint" syntax for
  # importing an extensionless file via a specific PropertySourceLoader (see
  # the "Importing Extensionless Files" section of the Spring Boot reference
  # docs). `optional:` means a missing .env (e.g. a fresh checkout, or CI)
  # is not an error - every property sourced from it (currently just
  # TRANSIT_REQUESTOR_REF, see below) already has a safe blank default.
  # Relaxed binding resolves TRANSIT_REQUESTOR_REF to transit.requestor-ref
  # exactly the same way it would for a real OS environment variable of
  # that name - confirmed empirically against this project's actual Spring
  # Boot version, not assumed from the docs alone.
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: backend

  datasource:
    url: jdbc:h2:file:./data/family-dashboard
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

household:
  members:
    - Alice
    - Bob
    - Charlie
    - Diana

weather:
  latitude: 49.0069
  longitude: 8.4037
  cache:
    # 15 minutes — matches docs/weather-widget-plan.md's recommended refresh
    # cadence. See WeatherCache's javadoc for why this is externalized
    # rather than a hardcoded constant.
    refresh-interval-millis: 900000
    # Kept short so the real app populates the widget almost immediately on
    # a cold boot, rather than leaving it showing "Wetter wird geladen…"
    # for up to a full refresh-interval-millis. src/test/resources/
    # application-test.yml overrides this to a much longer value so
    # @SpringBootTest contexts (which construct this bean for real, with
    # scheduling active) never trigger a live network call during a test
    # run.
    initial-delay-millis: 2000

# TRIAS (VDV 431-2) real-time departures via MobiData BW - see
# docs/departures-widget-plan.md's "Data source: TRIAS API via MobiData BW"
# section. Access requested by email to mobidata-bw@nvbw.de; not yet granted
# as of this ticket, so all three values below are empty placeholders. This
# doesn't block TriasDepartureProvider's request-building/response-parsing
# logic (see its own tests, which use WireMock and placeholder config), only
# an actual live call.
transit:
  # The TRIAS StopEventRequest endpoint to POST to, once MobiData BW's
  # response arrives.
  endpoint-url: "https://efa-bw.de/trias"
  # TRIAS auth is typically a "RequestorRef" identifier issued alongside the
  # endpoint, not a bearer token. It's a per-household credential, not
  # something that belongs in a public repo's history - real values live in
  # the gitignored backend/.env (TRANSIT_REQUESTOR_REF=...), loaded via
  # spring.config.import above; this placeholder's blank default is what's
  # actually committed. RequestorRef is a required element in every
  # conformant TRIAS request (see TriasDepartureProvider
  # .buildStopEventRequest()'s javadoc), so it's always sent, with empty
  # content while this is blank - note that doesn't make it fully
  # schema-valid either (RequestorRef's NMTOKEN-restricted type requires a
  # non-empty value), so a genuinely valid value is still needed.
  requestor-ref: "${TRANSIT_REQUESTOR_REF:}"
  # KVV's internal stop ID for "Wolfartsweierer Straße" (Karlsruhe). This is
  # the IFOPT/DHID-format stop-area reference (de:<Gemeindeschlüssel>:<local
  # id>) used nationwide in Germany's DELFI public-transport open data,
  # including MobiData BW/KVV's own feeds - found via OpenStreetMap's
  # ref:IFOPT tag on the stop's "public_transport=station" node (sourced
  # from the operator, Verkehrsbetriebe Karlsruhe GmbH), not yet confirmed
  # against a live TRIAS response. This is the stop-area level ref (covers
  # all platforms at this stop); the individual platforms underneath it
  # are de:08212:623:1:1 / :2:2 / :21:21 (bus) if a live query against the
  # area-level ref ever needs narrowing to just one platform/direction.
  stop-point-ref: "de:08212:623"
